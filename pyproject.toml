[project]
name = "my_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/my_project"]

[dependency-groups]
docs = [
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "nbsphinx>=0.9.8",
    "pandoc>=2.4",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-rtd-theme>=3.1.0",
]
test = [
    "pytest>=9.0.3",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ipykernel>=7.2.0",
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[tool.hatchling.build]
artifacts = ["src/my_project/_config/*.yaml"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["my_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
