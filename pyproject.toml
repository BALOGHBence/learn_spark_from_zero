[project]
name = "project"
version = "0.1.0"
description = "Learn Spark from Zero"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-connect==19.1.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/project"]

[dependency-groups]
docs = [
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "myst-nb>=1.4.0",
    "myst-parser>=5.1.0",
    "pandoc>=2.4",
    "pydata-sphinx-theme>=0.16.1",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinxcontrib-mermaid>=2.0.2",
]
test = [
    "pytest>=9.0.3",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "ipykernel>=7.2.0",
    "mypy>=2.1.0",
    "ruff>=0.15.14",
]

[tool.hatchling.build]
artifacts = ["src/project/_config/*.yaml"]

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
