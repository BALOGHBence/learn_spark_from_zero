- id: 7.2-005
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: How does Spark determine the type of a pandas UDF in current versions?
  answers:
  - text: From the Python type hints of the function, such as `pd.Series -> pd.Series`
    verdict: correct
    justification: Databricks explains that pandas UDF types are defined by Python type hints.
  - text: From a `functionType` string that is required
    verdict: true_but_irrelevant
    justification: The `functionType` argument is the older style; type hints are the current approach.
  - text: From the first returned value
    verdict: incorrect
    justification: The type is not inferred from returned values.
  - text: From the name of the function
    verdict: incorrect
    justification: The function name does not matter.
