- id: 7.2-026
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Which statement about returning data from an iterator pandas UDF is correct?
  answers:
  - text: Each output batch can have any length, independent of the input.
    verdict: incorrect
    justification: Individual batch sizes can vary, but the total length must match.
  - text: It must return exactly one batch.
    verdict: incorrect
    justification: It yields one batch per input batch.
  - text: The total length of all output batches must equal the total length of the input.
    verdict: correct
    justification: Databricks states the total output length of an iterator UDF must equal the total input length.
  - text: It must return a single scalar.
    verdict: incorrect
    justification: Only Series to scalar UDFs return a scalar.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-027
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A pandas UDF returns a struct of two fields per row.

    How can the return type and Python output be declared?
  answers:
  - text: Return a pandas Series of dictionaries with no return type.
    verdict: incorrect
    justification: The return type must be declared.
  - text: Struct outputs are not supported by pandas UDFs.
    verdict: incorrect
    justification: Struct outputs are supported.
  - text: Return a list of tuples with return type `"list"`.
    verdict: incorrect
    justification: '`"list"` is not a Spark type, and tuples are not the expected output.'
  - text: Declare a struct return type such as `"a long, b double"` and return a pandas DataFrame with columns `a` and `b`.
    verdict: correct
    justification: For a struct return type, a pandas UDF returns a pandas DataFrame whose columns match the struct fields.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.pandas_udf.html
- id: 7.2-028
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Why are pandas UDFs generally faster than row-at-a-time Python UDFs?
  answers:
  - text: They cache all results on the driver.
    verdict: incorrect
    justification: Results are not cached on the driver.
  - text: They transfer data in Arrow batches and use vectorized pandas operations instead of serializing and processing one row at a time.
    verdict: correct
    justification: Pandas UDFs move data in Arrow batches and use vectorized pandas operations instead of per-row serialization.
  - text: They skip the Python worker processes entirely.
    verdict: incorrect
    justification: They run in Python worker processes.
  - text: They run in the JVM instead of Python.
    verdict: incorrect
    justification: They still run in Python.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-029
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: When using `mapInPandas`, what does the function receive and return?
  answers:
  - text: It receives one row and returns one row.
    verdict: incorrect
    justification: It processes batches, not single rows.
  - text: It receives a Spark DataFrame and returns a pandas DataFrame.
    verdict: incorrect
    justification: It receives pandas DataFrames, not a Spark DataFrame.
  - text: It receives an iterator of pandas DataFrames and returns an iterator of pandas DataFrames.
    verdict: correct
    justification: The `mapInPandas` function receives an iterator of pandas DataFrames and yields pandas DataFrames.
  - text: It receives a single pandas Series and returns a scalar.
    verdict: true_but_irrelevant
    justification: Taking a Series and returning a scalar is what a Series to scalar UDF does.
  source_url: https://docs.databricks.com/aws/en/pandas/pandas-function-apis
- id: 7.2-030
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer compares `@pandas_udf` with a pandas UDF used in a `Window` aggregation, `mean_udf("v").over(w)`.

    Which pandas UDF type is required for this?
  answers:
  - text: Grouped map with `applyInPandas`
    verdict: incorrect
    justification: '`applyInPandas` is a grouped-map function API, not a window function.'
  - text: Iterator of Series to Iterator of Series
    verdict: incorrect
    justification: Iterator UDFs are not aggregate functions.
  - text: Series to Series
    verdict: incorrect
    justification: Series to Series UDFs are not aggregate functions.
  - text: Series to scalar
    verdict: correct
    justification: Window aggregations with `.over(w)` need a Series to scalar pandas UDF.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.functions.pandas_udf.html
- id: 7.2-031
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer's iterator pandas UDF opens a connection before processing batches and must always close it, even if an error occurs.

    Which pattern does the Databricks documentation suggest?
  answers:
  - text: Wrap the batch loop in `try`/`finally` or use a context manager so resources are released at the end.
    verdict: correct
    justification: Databricks recommends `try`/`finally` or context managers in iterator UDFs so resources are released at the end.
  - text: Store the connection in a broadcast variable.
    verdict: incorrect
    justification: Connections cannot be serialized as broadcast variables.
  - text: Open and close the connection on the driver before calling the UDF.
    verdict: incorrect
    justification: Connections opened on the driver are not available inside executor tasks.
  - text: Use a Series to Series UDF, which closes resources automatically.
    verdict: incorrect
    justification: Series to Series UDFs do not manage resources automatically.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
