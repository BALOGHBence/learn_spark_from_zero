- id: 7.2-019
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: What is a risk of `groupBy().applyInPandas()` with skewed groups?
  answers:
  - text: Large groups are automatically split into batches of 10,000 rows.
    verdict: incorrect
    justification: Groups are not split into batches.
  - text: All data of a group is loaded into memory before the function is applied, so large groups can cause out-of-memory errors.
    verdict: correct
    justification: Databricks warns that all data for a group is loaded into memory, so skewed groups can cause OOM; `maxRecordsPerBatch` does not apply to groups.
  - text: Skewed groups are dropped.
    verdict: incorrect
    justification: No groups are dropped.
  - text: The function runs on the driver for large groups.
    verdict: incorrect
    justification: The function runs on executors.
  source_url: https://docs.databricks.com/aws/en/pandas/pandas-function-apis
- id: 7.2-020
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer wants to transform an iterator of pandas DataFrames for each partition, for example to filter rows with custom pandas logic.

    Which API does this?
  answers:
  - text: '`df.applyInPandas(func)`'
    verdict: incorrect
    justification: DataFrames have no `applyInPandas`; it is on grouped data.
  - text: '`df.foreachBatch(func)`'
    verdict: incorrect
    justification: '`foreachBatch` is a streaming sink method.'
  - text: '`df.mapInPandas(func, schema=df.schema)`'
    verdict: correct
    justification: '`mapInPandas` transforms an iterator of pandas DataFrames per partition, with an output schema.'
  - text: '`df.groupBy().agg(func)`'
    verdict: incorrect
    justification: '`agg` takes aggregate expressions.'
  source_url: https://docs.databricks.com/aws/en/pandas/pandas-function-apis
