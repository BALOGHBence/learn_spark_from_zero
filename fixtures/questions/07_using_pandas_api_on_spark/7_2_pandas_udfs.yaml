# Objective 7.2: Create and invoke Pandas UDF.
- id: 7.2-001
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer defines a pandas UDF that multiplies two columns.

    Which code is correct?
  answers:
  - text: |-
      |
      ```python
      from pyspark.sql.functions import udf

      @udf("long", pandas=True)
      def multiply(a, b):
          return a * b

      df.select(multiply("x", "y"))
      ```
    verdict: incorrect
    justification: '`udf` has no `pandas` parameter; pandas UDFs use `@pandas_udf`.'
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf
      def multiply(a: pd.DataFrame) -> pd.DataFrame:
          return a.x * a.y

      df.select(multiply(df))
      ```
    verdict: incorrect
    justification: No return type is given, and passing the whole DataFrame as an argument is not valid.
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("long")
      def multiply(a: int, b: int) -> int:
          return a * b

      df.select(multiply("x", "y"))
      ```
    verdict: incorrect
    justification: The type hints must be pandas types; with plain `int` hints Spark cannot infer the pandas UDF type.
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("long")
      def multiply(a: pd.Series, b: pd.Series) -> pd.Series:
          return a * b

      df.select(multiply("x", "y"))
      ```
    verdict: correct
    justification: A Series to Series pandas UDF has `pd.Series` type hints and a return type such as `"long"`, and is called with column names.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-002
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: What is a pandas UDF also known as?
  answers:
  - text: A row-at-a-time UDF
    verdict: incorrect
    justification: Pandas UDFs are the opposite of row-at-a-time UDFs.
  - text: A scalar SQL UDF
    verdict: incorrect
    justification: SQL UDFs are a different UDF type.
  - text: A vectorized UDF
    verdict: correct
    justification: Databricks describes pandas UDFs as vectorized UDFs.
  - text: A table-valued function
    verdict: incorrect
    justification: Table-valued functions are a different concept.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-003
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Which technologies does a pandas UDF use to transfer and process data?
  answers:
  - text: JDBC to transfer data and SQL to process it
    verdict: incorrect
    justification: JDBC and SQL are unrelated.
  - text: Apache Arrow to transfer data and pandas to work with the data
    verdict: correct
    justification: Pandas UDFs use Apache Arrow to transfer data and pandas to work with it.
  - text: JSON to transfer data and plain Python loops to process it
    verdict: incorrect
    justification: JSON and per-row loops are what pandas UDFs avoid.
  - text: Py4J to transfer data and NumPy only to work with it
    verdict: incorrect
    justification: Pandas UDFs use Arrow for data transfer, not Py4J, and pandas, not only NumPy.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
