- id: 7.2-017
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer applies a function to each group, where the function receives all rows of a group as a pandas DataFrame and returns a pandas DataFrame.

    Which API does this?
  answers:
  - text: '`df.groupBy("id").applyInPandas(func, schema="id long, v double")`'
    verdict: correct
    justification: '`groupBy().applyInPandas(func, schema)` calls the function with each group as a pandas DataFrame and combines the results.'
  - text: '`df.mapInPandas(func).groupBy("id")`'
    verdict: incorrect
    justification: '`mapInPandas` works per partition, not per group, and grouping afterwards does nothing useful.'
  - text: '`df.groupBy("id").apply(func).toPandas()`'
    verdict: incorrect
    justification: '`toPandas` collects the result to the driver; grouped maps should use `applyInPandas`.'
  - text: '`df.groupBy("id").agg(pandas_udf(func))`'
    verdict: incorrect
    justification: '`agg` expects aggregate expressions, not a function that returns DataFrames.'
  source_url: https://docs.databricks.com/aws/en/pandas/pandas-function-apis
