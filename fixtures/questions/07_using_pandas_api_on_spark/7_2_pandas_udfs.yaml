- id: 7.2-022
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    Two DataFrames must be grouped by the same key and processed together with pandas.

    Which API is designed for this cogrouped map pattern?
  answers:
  - text: '`df1.groupBy("id").cogroup(df2.groupBy("id")).applyInPandas(func, schema)`'
    verdict: correct
    justification: Cogrouped map groups both DataFrames by key with `cogroup` and passes each pair of groups to `applyInPandas`.
  - text: '`pandas_udf(func)(df1, df2)`'
    verdict: incorrect
    justification: A pandas UDF is applied to columns, not to two DataFrames.
  - text: '`df1.unionByName(df2).applyInPandas(func)`'
    verdict: incorrect
    justification: DataFrames have no `applyInPandas`, and a union mixes both inputs together.
