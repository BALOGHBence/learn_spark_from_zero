- id: 7.2-006
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: For a Series to Series pandas UDF, what must the function return?
  answers:
  - text: A pandas DataFrame with any number of rows
    verdict: incorrect
    justification: It must return a Series, not a DataFrame of arbitrary length.
  - text: A single scalar value
    verdict: true_but_irrelevant
    justification: Returning a scalar is what a Series to scalar UDF does.
  - text: A pandas Series of the same length as the input
    verdict: correct
    justification: A Series to Series UDF must return a Series of the same length as its input.
  - text: A Python list of any length
    verdict: incorrect
    justification: It must return a pandas Series.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-007
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: How does Spark execute a Series to Series pandas UDF?
  answers:
  - text: It calls the function once per executor with all data.
    verdict: incorrect
    justification: The function is called per batch, not once per executor.
  - text: It splits the column into batches, calls the function for each batch, and concatenates the results.
    verdict: correct
    justification: Spark splits the data into batches, calls the function per batch and concatenates the results.
  - text: It collects the full column to the driver and calls the function once.
    verdict: incorrect
    justification: Data is not collected to the driver.
  - text: It calls the function once per row.
    verdict: true_but_irrelevant
    justification: Calling the function once per row is how a regular Python UDF works.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-008
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A pandas UDF must load a large machine learning model once and then score many batches.

    Which pandas UDF type is designed for initializing state like this?
  answers:
  - text: Series to Series
    verdict: partially_correct
    justification: A Series to Series UDF can also score batches, but it would load the model again for every batch.
  - text: A row-at-a-time Python UDF
    verdict: incorrect
    justification: A row-at-a-time UDF is slower and has no setup step either.
  - text: Series to scalar
    verdict: incorrect
    justification: Series to scalar UDFs aggregate; they do not score rows.
  - text: Iterator of Series to Iterator of Series
    verdict: correct
    justification: An iterator UDF can initialize state, such as a loaded model, once before processing all batches.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-009
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Which type hint defines an iterator pandas UDF that takes one column?
  answers:
  - text: '`Iterator[pd.DataFrame] -> pd.Series`'
    verdict: incorrect
    justification: The input is Series batches, and the output must be an iterator.
  - text: '`List[pd.Series] -> List[pd.Series]`'
    verdict: incorrect
    justification: '`List` is not a supported pandas UDF type hint.'
  - text: '`Iterator[pd.Series] -> Iterator[pd.Series]`'
    verdict: correct
    justification: An iterator UDF on one column is declared as `Iterator[pd.Series] -> Iterator[pd.Series]`.
  - text: '`pd.Series -> Iterator[pd.Series]`'
    verdict: incorrect
    justification: The input must also be an iterator.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-010
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer writes an iterator pandas UDF that takes two columns.

    Which type hint is correct?
  answers:
  - text: '`pd.Series, pd.Series -> Iterator[pd.Series]`'
    verdict: incorrect
    justification: The input must be an iterator of tuples.
  - text: '`Iterator[Tuple[pd.Series, pd.Series]] -> Iterator[pd.Series]`'
    verdict: correct
    justification: Multiple input columns are declared as `Iterator[Tuple[pd.Series, ...]] -> Iterator[pd.Series]`.
  - text: '`Iterator[pd.Series, pd.Series] -> pd.Series`'
    verdict: incorrect
    justification: '`Iterator` takes a single type argument, and the output must be an iterator.'
  - text: '`Tuple[Iterator[pd.Series]] -> Iterator[pd.Series]`'
    verdict: incorrect
    justification: The tuple goes inside the iterator, not around it.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-011
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Which code is a correct iterator pandas UDF that adds 1 to every value?
  answers:
  - text: |-
      |
      ```python
      from typing import Iterator
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("long")
      def plus_one(batches: Iterator[pd.Series]) -> Iterator[pd.Series]:
          for s in batches:
              yield s + 1
      ```
    verdict: correct
    justification: An iterator UDF loops over the batches and yields one result Series per batch.
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("long")
      def plus_one(s: pd.Series) -> Iterator[pd.Series]:
          yield s + 1
      ```
    verdict: incorrect
    justification: The input type hint must be `Iterator[pd.Series]` for an iterator UDF.
  - text: |-
      |
      ```python
      from pyspark.sql.functions import udf

      @udf("long")
      def plus_one(batches):
          for s in batches:
              yield s + 1
      ```
    verdict: incorrect
    justification: A regular `@udf` processes rows, not batches.
  - text: |-
      |
      ```python
      from typing import Iterator
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("long")
      def plus_one(batches: Iterator[pd.Series]) -> Iterator[pd.Series]:
          return batches + 1
      ```
    verdict: incorrect
    justification: An iterator cannot be added to a number; each batch must be processed and yielded.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-012
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: |-
    A data engineer needs a custom aggregation, such as a weighted mean, usable with `groupBy().agg()`.

    Which pandas UDF type fits?
  answers:
  - text: Iterator of Series to Iterator of Series
    verdict: incorrect
    justification: Iterator UDFs return one value per row.
  - text: Iterator of multiple Series to Iterator of Series
    verdict: incorrect
    justification: Iterator UDFs return one value per row.
  - text: Series to Series
    verdict: incorrect
    justification: Series to Series returns one value per row, not an aggregate.
  - text: Series to scalar, with a type hint like `pd.Series -> float`
    verdict: correct
    justification: A Series to scalar UDF aggregates a Series to one value and can be used in `groupBy().agg()`.
  source_url: https://docs.databricks.com/aws/en/udf/pandas
- id: 7.2-013
  category: using_pandas_api_on_spark
  objective: '7.2'
  question: Which code defines and uses a Series to scalar pandas UDF for the mean of `v` per `id`?
  answers:
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("double")
      def mean_udf(v: pd.Series) -> float:
          return v.mean()

      df.groupBy("id").apply(mean_udf("v"))
      ```
    verdict: incorrect
    justification: '`GroupedData.apply` is for grouped-map functions, not scalar aggregates.'
  - text: |-
      |
      ```python
      from pyspark.sql.functions import udf

      @udf("double")
      def mean_udf(v):
          return sum(v) / len(v)

      df.groupBy("id").agg(mean_udf("v"))
      ```
    verdict: incorrect
    justification: A regular Python UDF cannot be used as an aggregate function.
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("double")
      def mean_udf(v: pd.Series) -> pd.Series:
          return v.mean()

      df.groupBy("id").agg(mean_udf("v"))
      ```
    verdict: incorrect
    justification: The hint `-> pd.Series` makes it a Series to Series UDF, which `agg` rejects.
  - text: |-
      |
      ```python
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("double")
      def mean_udf(v: pd.Series) -> float:
          return v.mean()

      df.groupBy("id").agg(mean_udf("v"))
      ```
    verdict: correct
    justification: '`pd.Series -> float` declares a Series to scalar UDF, which can be used in `groupBy().agg()`.'
  source_url: https://docs.databricks.com/aws/en/udf/pandas
