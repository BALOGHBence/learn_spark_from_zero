- id: 2.4-031
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A data engineer wants to update the definition of an existing temporary view `active_users`.

    Which statement is correct?
  answers:
  - text: '`CREATE OR REPLACE TEMPORARY VIEW active_users AS SELECT * FROM users WHERE active`'
    verdict: correct
    justification: '`CREATE OR REPLACE TEMPORARY VIEW` redefines the view.'
  - text: '`REPLACE VIEW active_users WITH SELECT * FROM users WHERE active`'
    verdict: incorrect
    justification: '`REPLACE VIEW ... WITH` is not Spark SQL syntax.'
  - text: '`UPDATE VIEW active_users AS SELECT * FROM users WHERE active`'
    verdict: incorrect
    justification: '`UPDATE VIEW` is not SQL.'
  - text: '`ALTER TEMPORARY VIEW active_users SET QUERY SELECT * FROM users WHERE active`'
    verdict: incorrect
    justification: '`ALTER TEMPORARY VIEW ... SET QUERY` is not valid syntax.'
  source_url: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-create-view
