- id: 2.4-030
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A data engineer registers a streaming DataFrame as a temporary view with `createOrReplaceTempView`.

    Which statement is correct?
  answers:
  - text: The view contains a static snapshot of the stream.
    verdict: incorrect
    justification: The view stays streaming; it is not a static snapshot.
  - text: Temporary views cannot be created from streaming DataFrames.
    verdict: incorrect
    justification: Streaming DataFrames can be registered as temporary views.
  - text: SQL queries on the view return a streaming DataFrame, which can be written with `writeStream`.
    verdict: correct
    justification: Temporary views work with streaming DataFrames; SQL on such a view returns a streaming DataFrame that you write with `writeStream`.
  - text: The view converts the stream into a batch table automatically.
    verdict: incorrect
    justification: The view does not turn the stream into a batch table.
