- id: 2.4-027
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A data engineer calls `df.createOrReplaceGlobalTempView("lookup")` and then queries `SELECT * FROM lookup` without a prefix.

    What happens?
  answers:
  - text: The query fails, because global temporary views live in the `global_temp` schema and must be qualified.
