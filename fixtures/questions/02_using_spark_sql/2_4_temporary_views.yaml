- id: 2.4-029
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A developer needs a view only for the remainder of a notebook to simplify several SQL queries over an intermediate DataFrame.

    Which object is the best fit?
  answers:
  - text: A global temporary view shared across applications
    verdict: incorrect
    justification: Global temporary views are shared within one application, not across applications, and are more than this needs.
  - text: A Unity Catalog managed table
    verdict: incorrect
    justification: A managed table persists data beyond the notebook, which is not needed here.
  - text: An external table
    verdict: incorrect
    justification: An external table persists data and metadata beyond the notebook.
  - text: A temporary view
    verdict: correct
    justification: A temporary view lasts for the session and needs no storage, which fits a notebook-only helper.
