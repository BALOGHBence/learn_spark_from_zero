    verdict: incorrect
    justification: Spark does not substitute a persistent table for a missing view.
  - text: The query succeeds, because global views are visible without a prefix.
    verdict: incorrect
    justification: Global views must be qualified with `global_temp`.
  - text: The query succeeds only on the second run.
