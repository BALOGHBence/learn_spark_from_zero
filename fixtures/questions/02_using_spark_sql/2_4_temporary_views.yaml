- id: 2.4-025
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A team uses SQL analysts and Python developers on one pipeline.

    What is the main benefit of registering DataFrames as temporary views?
  answers:
  - text: Temporary views speed up queries by indexing data.
    verdict: incorrect
    justification: Views do not create indexes.
  - text: Temporary views back up data in the metastore.
    verdict: incorrect
    justification: Temporary views store nothing in the metastore.
  - text: The same data can be queried with SQL syntax by analysts while developers keep using the DataFrame API.
    verdict: correct
    justification: Temporary views let analysts query the data with SQL while developers keep working with the DataFrame API on the same data.
  - text: Temporary views make data available to external BI tools permanently.
    verdict: incorrect
    justification: Temporary views are session-scoped, not permanent and not visible to external tools.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.createOrReplaceTempView.html
- id: 2.4-026
  category: using_spark_sql
  objective: '2.4'
  question: |-
    A data engineer uses `spark.sql("SELECT * FROM {df} WHERE amount > 100", df=orders_df)` in PySpark.

    What does this do?
  answers:
  - text: It fails because DataFrames can only be queried after `createTempView`.
    verdict: incorrect
    justification: Parameterized queries can reference DataFrames directly.
  - text: It references the DataFrame directly in the query through a parameterized SQL query, without registering a named view first.
    verdict: correct
    justification: PySpark's `spark.sql` accepts DataFrames as keyword arguments referenced with `{df}`, so no view has to be registered first.
  - text: It writes `orders_df` to a table named `df`.
    verdict: incorrect
