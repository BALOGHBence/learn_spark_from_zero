- id: 6.1-031
  category: using_spark_connect
  objective: '6.1'
  question: Which multi-tenancy issue does Spark Connect address?
  answers:
  - text: One client's heavy workload or dependency conflict should not destabilize a shared driver used by other clients.
    verdict: correct
    justification: Spark Connect isolates clients, so one client's heavy workload or dependency conflict does not destabilize a shared driver.
  - text: Executors cannot be shared by different stages.
    verdict: incorrect
    justification: Executors are shared by stages normally.
  - text: Multiple clusters cannot read the same table.
    verdict: incorrect
    justification: Reading the same table from several clusters is not a multi-tenancy issue Spark Connect solves.
  - text: The cluster manager cannot allocate resources fairly.
    verdict: incorrect
    justification: Resource allocation is the cluster manager's job, not what Spark Connect addresses.
  source_url: https://spark.apache.org/docs/latest/spark-connect-overview.html
