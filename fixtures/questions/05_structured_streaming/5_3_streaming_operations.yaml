- id: 5.3-031
  category: structured_streaming
  objective: '5.3'
  question: |-
    A data engineer computes 1-day windows on a timestamp in UTC but wants the windows to start at 02:00 instead of midnight.

    Which parameter of `window` supports this?
  answers:
  - text: '`timezone` set to `"+02:00"`'
    verdict: incorrect
    justification: '`window` has no `timezone` parameter.'
  - text: '`offset`, for example `window("ts", "1 day", offset=2)`'
    verdict: incorrect
    justification: '`window` has no `offset` parameter.'
  - text: '`startTime`, for example `window("ts", "1 day", startTime="2 hours")`'
    verdict: correct
    justification: The `startTime` parameter shifts window boundaries, so 1-day windows can start at 02:00.
  - text: '`slideDuration` set to `"2 hours"`'
    verdict: incorrect
