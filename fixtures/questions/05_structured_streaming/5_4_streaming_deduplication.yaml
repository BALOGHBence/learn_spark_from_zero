- id: 5.4-031
  category: structured_streaming
  objective: '5.4'
  question: |-
    A query uses `dropDuplicatesWithinWatermark(["id"])` with a 1-hour watermark. A record arrives whose event time is older than the current watermark.

    What does the PySpark documentation say happens to such data?
  answers:
  - text: Data that is too late, older than the watermark, is dropped.
    verdict: correct
    justification: The PySpark docs note that data older than the watermark is dropped.
  - text: It causes the query to restart.
    verdict: incorrect
    justification: Late data does not restart the query.
  - text: It is always written to the sink as a new record.
    verdict: incorrect
    justification: Data that is too late is dropped, not written.
  - text: It replaces the earlier duplicate in the sink.
    verdict: incorrect
    justification: Rows already in the sink are not replaced.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.dropDuplicatesWithinWatermark.html
