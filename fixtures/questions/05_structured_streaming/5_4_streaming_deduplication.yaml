    justification: Duplicates are compared across rows.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.dropDuplicates.html
- id: 5.4-026
  category: structured_streaming
  objective: '5.4'
  question: |-
    A query uses `withWatermark("ts", "2 hours").dropDuplicatesWithinWatermark(["event_id"])`. Two copies of an event arrive 30 minutes apart.

