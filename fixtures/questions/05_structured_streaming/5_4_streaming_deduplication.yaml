- id: 5.4-028
  category: structured_streaming
  objective: '5.4'
  question: |-
    A data engineer runs `stream_df.distinct()` to remove duplicates.

    What does the Spark streaming guide say?
  answers:
  - text: Distinct operations on streaming Datasets are not supported; use `dropDuplicates` instead.
