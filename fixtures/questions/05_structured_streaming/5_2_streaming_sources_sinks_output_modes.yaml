  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-013
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer needs to upsert each micro-batch of a stream into a Delta table with `MERGE`.

    Which API supports this?
  answers:
  - text: '`outputMode("merge")`'
    verdict: incorrect
    justification: There is no `merge` output mode.
  - text: '`foreachBatch`, which runs a function on each micro-batch''s DataFrame'
    verdict: correct
    justification: '`foreachBatch` passes each micro-batch as a DataFrame, so you can run a Delta `MERGE` on it.'
  - text: '`foreach`, which receives one micro-batch DataFrame'
    verdict: incorrect
    justification: '`foreach` receives rows, not DataFrames.'
  - text: '`trigger(merge=True)`'
    verdict: incorrect
    justification: '`trigger` has no `merge` parameter.'
  source_url: https://docs.databricks.com/aws/en/structured-streaming/foreach
- id: 5.2-014
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer writes each micro-batch to two different tables.

    Which code does this?
  answers:
  - text: |-
      ```python
      df.writeStream.foreach(lambda row: row.write.saveAsTable("main.a.t1")).start()
      ```
    verdict: incorrect
    justification: '`foreach` receives rows, which have no `write` attribute.'
  - text: |-
      ```python
      (df.writeStream
         .format("multi")
         .option("tables", "main.a.t1,main.a.t2")
         .start())
      ```
    verdict: incorrect
    justification: There is no `multi` format.
  - text: |-
      ```python
      (df.writeStream
         .toTable("main.a.t1")
         .toTable("main.a.t2"))
      ```
    verdict: incorrect
    justification: '`toTable` starts the query and returns a `StreamingQuery`, so it cannot be chained twice.'
  - text: |-
      ```python
      def write_both(batch_df, batch_id):
          batch_df.write.mode("append").saveAsTable("main.a.t1")
          batch_df.write.mode("append").saveAsTable("main.a.t2")

      (df.writeStream
         .foreachBatch(write_both)
         .option("checkpointLocation", chk)
         .start())
      ```
    verdict: correct
    justification: '`foreachBatch` lets the function write each micro-batch to several tables.'
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.foreachBatch.html
- id: 5.2-015
  category: structured_streaming
  objective: '5.2'
  question: What arguments does the function passed to `foreachBatch` receive?
  answers:
  - text: One row and its partition id
    verdict: true_but_irrelevant
    justification: One row per call is how `foreach` works, without a partition id.
  - text: The source offsets only
    verdict: incorrect
    justification: It receives the data, not just offsets.
  - text: The micro-batch as a DataFrame and the unique batch id
    verdict: correct
    justification: The function receives the micro-batch DataFrame and a unique batch id.
  - text: The streaming query and its checkpoint path
    verdict: incorrect
    justification: It does not receive the query or the checkpoint path.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.foreachBatch.html
- id: 5.2-016
  category: structured_streaming
  objective: '5.2'
  question: What is the difference between `foreach` and `foreachBatch`?
  answers:
  - text: '`foreach` applies custom logic to each row, while `foreachBatch` applies logic to each micro-batch as a DataFrame.'
    verdict: correct
    justification: '`foreach` processes each row with custom logic; `foreachBatch` processes each micro-batch as a DataFrame.'
  - text: '`foreach` runs on the driver only.'
    verdict: incorrect
    justification: '`foreach` runs on executors.'
  - text: They are identical.
    verdict: incorrect
    justification: They work at different granularities.
  - text: '`foreachBatch` is only for batch DataFrames.'
    verdict: incorrect
    justification: '`foreachBatch` is a streaming API.'
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.foreach.html
