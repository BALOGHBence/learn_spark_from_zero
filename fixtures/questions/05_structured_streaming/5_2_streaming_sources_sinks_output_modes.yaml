# Objective 5.2: Create and write Streaming DataFrames and Streaming Datasets, including the basic output modes and output sinks.
- id: 5.2-001
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer creates a streaming DataFrame from the Delta table `main.raw.events`.

    Which code does this?
  answers:
  - text: '`spark.readStream.parquet("main.raw.events")`'
    verdict: incorrect
    justification: '`parquet()` expects a file path, not a table name.'
  - text: '`spark.read.stream("main.raw.events")`'
    verdict: incorrect
    justification: '`DataFrameReader` has no `stream` method; streaming reads use `spark.readStream`.'
  - text: '`spark.table("main.raw.events").stream()`'
    verdict: incorrect
    justification: DataFrames have no `stream()` method.
  - text: '`spark.readStream.table("main.raw.events")`'
    verdict: correct
    justification: '`spark.readStream.table(...)` creates a streaming DataFrame from a table.'
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamReader.table.html
- id: 5.2-002
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer writes a streaming DataFrame to the Delta table `main.silver.events`, with a checkpoint.

    Which code does this?
  answers:
  - text: |-
      ```python
      (df.writeStream
         .saveAsTable("main.silver.events")
         .start())
      ```
    verdict: incorrect
    justification: '`DataStreamWriter` has no `saveAsTable`; use `toTable`, which also starts the query.'
  - text: |-
      ```python
      (df.writeStream
         .option("checkpointLocation", "/Volumes/main/silver/chk/events")
         .toTable("main.silver.events"))
      ```
    verdict: correct
    justification: '`writeStream` with a `checkpointLocation` and `toTable(...)` starts a streaming write into the table.'
  - text: |-
      ```python
      (df.write
         .option("checkpointLocation", "/Volumes/main/silver/chk/events")
         .saveAsTable("main.silver.events"))
      ```
    verdict: incorrect
    justification: '`df.write` is for batch DataFrames; streaming DataFrames must use `writeStream`.'
  - text: |-
      ```python
      (df.writeStream
         .checkpoint("/Volumes/main/silver/chk/events")
         .table("main.silver.events"))
      ```
    verdict: incorrect
    justification: There is no `checkpoint()` method or `table()` method on `DataStreamWriter`.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.toTable.html
- id: 5.2-003
  category: structured_streaming
  objective: '5.2'
  question: Which output modes does Structured Streaming support?
  answers:
  - text: Append, update and complete
    verdict: correct
    justification: Structured Streaming supports the append, update and complete output modes.
  - text: Append, overwrite and ignore
    verdict: true_but_irrelevant
    justification: Overwrite and ignore are batch save modes, not streaming output modes.
  - text: Append, merge and replace
    verdict: incorrect
    justification: Merge and replace are not output modes.
  - text: Insert, update and delete
    verdict: incorrect
    justification: Insert, update and delete are DML operations.
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.outputMode.html
- id: 5.2-004
  category: structured_streaming
  objective: '5.2'
  question: Which output mode is the default for streaming queries?
  answers:
  - text: Update
    verdict: incorrect
    justification: Update must be set explicitly.
  - text: Complete
    verdict: incorrect
    justification: Complete must be set explicitly.
  - text: Append
    verdict: correct
    justification: Databricks documents append as the default output mode.
  - text: Overwrite
    verdict: true_but_irrelevant
    justification: Overwrite is a batch save mode, not a streaming output mode.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-005
  category: structured_streaming
  objective: '5.2'
  question: |-
    A streaming aggregation must write the whole updated result table to the sink on every trigger.

    Which output mode does this?
  answers:
  - text: Append
    verdict: incorrect
    justification: Append writes only rows that will not change anymore.
  - text: Update
    verdict: incorrect
    justification: Update writes only the rows that changed.
  - text: Ignore
    verdict: true_but_irrelevant
    justification: Ignore is a batch save mode.
  - text: Complete
    verdict: correct
    justification: Complete mode writes the whole result table on every trigger.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-006
  category: structured_streaming
  objective: '5.2'
  question: Which output mode can only be used with streaming aggregations?
  answers:
  - text: Complete
    verdict: correct
    justification: Databricks states complete mode only works with streaming aggregations.
  - text: Update
    verdict: incorrect
    justification: Update works with non-aggregation queries.
  - text: Append
    verdict: incorrect
    justification: Append works with non-aggregation queries.
  - text: All modes can be used with any query
    verdict: incorrect
    justification: Complete mode is limited to aggregations.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-007
  category: structured_streaming
  objective: '5.2'
  question: |-
    A dashboard needs the freshest values of a streaming aggregation, accepting that rows may be rewritten as they change.

    Which output mode writes all rows that changed during the trigger?
  answers:
  - text: Ignore
    verdict: true_but_irrelevant
    justification: Ignore is a batch save mode.
  - text: Update
    verdict: correct
    justification: Update mode writes every row that changed during the trigger, keeping the sink fresh.
  - text: Append
    verdict: incorrect
    justification: Append waits until rows are final, which delays results.
  - text: Complete
    verdict: partially_correct
    justification: Complete also shows the latest values, but it rewrites the entire result each trigger, which is costly.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-008
  category: structured_streaming
  objective: '5.2'
  question: |-
    A downstream notification service must act exactly once per row written to the sink.

    Which output mode does Databricks suggest in most cases?
  answers:
  - text: Complete, because it rewrites the full result
    verdict: incorrect
    justification: Complete mode rewrites all rows each trigger, repeating notifications.
  - text: Update, because it writes rows every time they change
    verdict: true_but_irrelevant
    justification: It is true that update mode writes a row every time it changes, but that causes repeated notifications here.
  - text: Append, because each record is written only once
    verdict: correct
    justification: Databricks suggests append mode when downstream services act on every write, because each record is written only once.
  - text: Any mode, because they behave the same for aggregations
    verdict: incorrect
    justification: The modes behave differently for aggregations.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-009
  category: structured_streaming
  objective: '5.2'
  question: |-
    A stateless streaming query only filters and projects rows.

    How do the output modes behave for it?
  answers:
  - text: Append mode drops rows.
    verdict: incorrect
    justification: Append mode does not drop rows in stateless queries.
  - text: All output modes behave the same, because each trigger only emits the rows processed in that trigger.
    verdict: correct
    justification: 'For stateless queries, all output modes behave the same: each trigger emits the rows processed in that trigger.'
  - text: Update mode rewrites all rows.
    verdict: incorrect
    justification: Update mode does not rewrite all rows.
  - text: Only complete mode is allowed.
    verdict: incorrect
    justification: Complete mode is only for aggregations.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-010
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer writes a streaming aggregation to a Delta Lake table in update mode.

    What does the Databricks documentation say?
  answers:
  - text: Delta Lake supports only complete mode.
    verdict: incorrect
    justification: Delta Lake supports append as well as complete.
  - text: Delta Lake supports all three modes.
    verdict: incorrect
    justification: Update mode is not supported for Delta Lake sinks.
  - text: Delta Lake sinks support append and complete modes but not update mode; for update-like behavior, use merge in streaming with `foreachBatch`.
    verdict: correct
    justification: Databricks states that Delta Lake sinks support append and complete but not update; use merge with `foreachBatch` for update-like behaviour.
  - text: Delta Lake supports only update mode.
    verdict: incorrect
    justification: Delta Lake does not support update mode.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-011
  category: structured_streaming
  objective: '5.2'
  question: Which sink supports all output modes according to the Databricks documentation?
  answers:
  - text: Kafka
    verdict: correct
    justification: Databricks states that Kafka supports all output modes.
  - text: The file sink
    verdict: incorrect
    justification: The file sink supports only append.
  - text: None
    verdict: incorrect
    justification: Kafka supports all three.
  - text: Delta Lake
    verdict: incorrect
    justification: Delta Lake supports append and complete only.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
- id: 5.2-012
  category: structured_streaming
  objective: '5.2'
  question: |-
    A stream-stream join is written to a sink.

    Which output mode do joins support?
  answers:
  - text: All modes
    verdict: incorrect
    justification: Only append is supported.
  - text: Complete only
    verdict: incorrect
    justification: Complete mode does not apply to joins.
  - text: Update only
    verdict: incorrect
    justification: Update mode does not apply to joins.
  - text: Append only
