- id: 5.2-028
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer writes a stream that processes all available data and stops, to run as a scheduled job.

    Which code is correct?
  answers:
  - text: '`df.write.trigger(availableNow=True).saveAsTable("main.silver.t")`'
    verdict: incorrect
    justification: Batch writers have no `trigger`.
  - text: '`df.writeStream.trigger(processingTime="once").toTable("main.silver.t")`'
    verdict: incorrect
    justification: '`processingTime` expects an interval, not `"once"`.'
  - text: '`df.writeStream.option("availableNow", True).toTable("main.silver.t")`'
    verdict: incorrect
    justification: '`availableNow` is a trigger setting, not an option.'
  - text: '`df.writeStream.trigger(availableNow=True).option("checkpointLocation", chk).toTable("main.silver.t")`'
    verdict: correct
    justification: '`trigger(availableNow=True)` with a checkpoint processes all available data and stops.'
  source_url: https://spark.apache.org/docs/latest/api/python/reference/pyspark.ss/api/pyspark.sql.streaming.DataStreamWriter.trigger.html
- id: 5.2-029
  category: structured_streaming
  objective: '5.2'
  question: |-
    A streaming aggregation without a watermark is written with append mode.

    What happens?
  answers:
  - text: It drops all late data automatically.
    verdict: incorrect
    justification: Without a watermark there is no lateness threshold to drop data.
  - text: It works and writes each row once.
    verdict: incorrect
    justification: Rows are never final without a watermark.
  - text: It is not supported, because without a watermark the aggregation results can always change and never become final.
    verdict: correct
    justification: Without a watermark, aggregation results never become final, so append mode is not supported for them.
  - text: It silently switches to complete mode.
    verdict: incorrect
    justification: Spark does not switch modes silently.
  source_url: https://spark.apache.org/docs/latest/streaming/apis-on-dataframes-and-datasets.html
- id: 5.2-030
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer reads a stream from Kafka.

    Which code is correct?
  answers:
  - text: '`spark.readStream.kafka("orders", servers)`'
    verdict: incorrect
    justification: '`DataStreamReader` has no `kafka` method.'
  - text: '`spark.readStream.format("kafka").option("kafka.bootstrap.servers", servers).option("subscribe", "orders").load()`'
    verdict: correct
    justification: Kafka streams use `format("kafka")` with `kafka.bootstrap.servers` and `subscribe`.
  - text: '`spark.readStream.format("kafka").load("orders")`'
    verdict: incorrect
    justification: Topics are set with `subscribe`, not passed as a path.
  - text: '`spark.read.format("kafka").stream("orders")`'
    verdict: incorrect
    justification: '`read` is for batch reads, and there is no `stream` method.'
  source_url: https://spark.apache.org/docs/latest/streaming/structured-streaming-kafka-integration.html
- id: 5.2-031
  category: structured_streaming
  objective: '5.2'
  question: |-
    A data engineer wants the semantics of complete mode for a large, growing aggregation on Databricks, but complete mode performs poorly as data scales.

    What does Databricks recommend instead?
  answers:
  - text: Writing the aggregation in update mode to a Delta table
    verdict: incorrect
    justification: Delta Lake sinks do not support update mode.
  - text: Using the `memory` sink
    verdict: incorrect
    justification: The memory sink is for testing only.
  - text: Using `foreach` with a Python dictionary
    verdict: incorrect
    justification: A driver-side dictionary is neither scalable nor fault-tolerant.
  - text: Materialized views, which provide those semantic guarantees with incremental processing
    verdict: correct
    justification: Databricks recommends materialized views to get complete-mode semantics with incremental processing.
  source_url: https://docs.databricks.com/aws/en/structured-streaming/output-mode
